{% extends "admin_base.html" %}

{% block content %}


<form method="POST" class="max-w-3xl mx-auto space-y-6 bg-white border border-[#f3e8d7] rounded-2xl shadow-sm p-6 sm:p-8">
    {% csrf_token %}
    <h1 class="text-2xl font-bold text-slate-800">Add Dog Breed</h1>
        <a href="{% url 'dog_breed_list' %}" class="text-sm text-amber-700 hover:text-amber-800 font-semibold">
            ← Back to Breeds
        </a>
    <label for="question" class="block text-sm font-semibold text-slate-700 mb-2">Dog Breed</label>
    <input type="text" name="name" value="{{ breed.name }}" required maxlength="100" class="w-full bg-[#FAF6F0] border border-[#f3e8d7] rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-amber-500">

    <label for="description" class="block text-sm font-semibold text-slate-700 mb-2 mt-4">Description</label>
    <textarea name="description" rows="4" class="w-full bg-[#FAF6F0] border border-[#f3e8d7] rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-amber-500">{{ breed.description }}</textarea>
    <button type="submit" class="mt-4 px-6 py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-sm font-semibold">Add Breed</button>
</form>


{% endblock content %}
