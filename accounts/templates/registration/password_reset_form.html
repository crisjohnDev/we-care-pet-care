
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | We Care Pet Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#FAF6F0] flex items-center justify-center p-4">

    <div class="bg-white max-w-md w-full rounded-3xl shadow-xl p-8">
        <h1 class="text-2xl font-bold text-slate-900 text-center">
            Forgot Password?
        </h1>

        <p class="text-sm text-slate-500 text-center mt-2 mb-6">
            Enter your registered email address. We'll send you a password-reset link.
        </p>

        <form method="POST">
            {% csrf_token %}

            {% if form.email.errors %}
                <div class="text-red-600 text-sm mb-3">
                    {{ form.email.errors }}
                </div>
            {% endif %}

            <label for="id_email" class="block text-sm font-semibold mb-2">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                id="id_email"
                required
                autocomplete="email"
                class="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-500"
                placeholder="Enter your email address"
            >

            <button
                type="submit"
                class="w-full mt-5 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-xl py-3"
            >
                Send Reset Link
            </button>
        </form>

        <a href="{% url 'login' %}"
           class="block text-center text-sm text-amber-700 mt-5">
            Back to Login
        </a>
    </div>

</body>
</html>
